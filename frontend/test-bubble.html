<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bubble Test</title>
  <style>
    body {
      background: #1b1b2f;
      color: white;
      font-family: Arial, sans-serif;
      padding: 50px;
    }
    button {
      background: #ff5588;
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 10px;
      margin: 10px;
    }
    button:hover {
      background: #ff77aa;
    }
    #log {
      margin-top: 30px;
      background: #000;
      padding: 20px;
      border-radius: 10px;
      font-family: monospace;
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>Bubble Test Page</h1>
  <p>Click buttons to test bubble display:</p>

  <button onclick="testBubble1()">Show Bubble 1</button>
  <button onclick="testBubble2()">Show Bubble 2</button>
  <button onclick="testAlert()">Show Alert</button>

  <div id="log"></div>

  <script>
    function log(msg) {
      const el = document.getElementById('log');
      el.innerHTML = `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>` + el.innerHTML;
    }

    function showSimpleBubble(name, text) {
      log('Creating bubble for: ' + name);

      // Remove old
      const old = document.getElementById('simple-bubble');
      if (old) {
        log('Removing old bubble');
        old.remove();
      }

      const bubble = document.createElement('div');
      bubble.id = 'simple-bubble';
      bubble.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); background:#fff; color:#333; padding:12px 20px; border-radius:15px; font-size:14px; box-shadow:0 4px 20px rgba(0,0,0,0.4); z-index:99999; border:3px solid #5588ff; max-width:300px; text-align:center;';
      bubble.innerHTML = '<b style="color:#5588ff">' + name + ':</b> ' + text;

      document.body.appendChild(bubble);
      log('Bubble appended to body');

      // Check if bubble exists
      const check = document.getElementById('simple-bubble');
      if (check) {
        log('Bubble found in DOM: ' + check.innerHTML.substring(0, 50));
      } else {
        log('ERROR: Bubble NOT found in DOM!');
      }

      setTimeout(() => {
        const el = document.getElementById('simple-bubble');
        if (el) {
          el.remove();
          log('Bubble removed after timeout');
        }
      }, 8000);
    }

    function testBubble1() {
      log('Button 1 clicked');
      showSimpleBubble('Amber', 'Hello! This is test message 1');
    }

    function testBubble2() {
      log('Button 2 clicked');
      showSimpleBubble('Mike', 'Hi there! Test message 2 at ' + new Date().toLocaleTimeString());
    }

    function testAlert() {
      log('Alert button clicked');
      alert('If you see this alert, JavaScript is working!');
    }

    log('Page loaded');
  </script>
</body>
</html>
