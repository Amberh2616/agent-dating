<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bubble Test</title>
  <style>
    body { background: #333; font-family: Arial; }
    button { padding: 20px 40px; font-size: 18px; margin: 20px; cursor: pointer; }
    #bubble-layer { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }
  </style>
</head>
<body>
  <h1 style="color:white">Bubble Test Page</h1>
  <button onclick="showBubble('Mike', 'Hello from RIGHT!')">Test Mike (Right)</button>
  <button onclick="showBubble('Amber', 'Hello from LEFT!')">Test Amber (Left)</button>
  <button onclick="showBubble('Test', 'Generic bubble!')">Test Generic</button>

  <div id="bubble-layer"></div>

  <script>
    function showBubble(name, msg) {
      var layer = document.getElementById('bubble-layer');
      if (!layer) {
        alert('bubble-layer not found!');
        return;
      }

      var id = 'bubble-' + name + '-' + Date.now();

      var agentStyles = {
        'Amber': { border: '#ff69b4', text: '#ff69b4', side: 'left' },
        'Mike': { border: '#5588ff', text: '#5588ff', side: 'right' },
      };
      var style = agentStyles[name] || { border: '#5588ff', text: '#5588ff', side: 'left' };

      var sameSideBubbles = layer.querySelectorAll('.agent-bubble[data-side="' + style.side + '"]');
      var topOffset = 100 + (sameSideBubbles.length * 80);

      var bubble = document.createElement('div');
      bubble.id = id;
      bubble.className = 'agent-bubble';
      bubble.setAttribute('data-side', style.side);

      var positionStyle = style.side === 'left' ? 'left:20px;' : 'right:20px;';

      bubble.style.cssText = [
        'position:fixed',
        'top:' + topOffset + 'px',
        positionStyle,
        'background:#fff',
        'color:#333',
        'padding:12px 18px',
        'border-radius:14px',
        'font-size:14px',
        'box-shadow:0 4px 20px rgba(0,0,0,0.4)',
        'border:3px solid ' + style.border,
        'max-width:280px',
        'text-align:left',
        'z-index:9999'
      ].join(';');

      bubble.innerHTML = '<b style="color:' + style.text + '">' + name + ':</b> ' + msg;
      layer.appendChild(bubble);

      console.log('Bubble created:', name, msg);

      setTimeout(function() {
        var el = document.getElementById(id);
        if (el) el.remove();
      }, 8000);
    }
  </script>
</body>
</html>
